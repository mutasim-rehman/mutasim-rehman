name: Update contribution spectrum

on:
  schedule:
    - cron: "25 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-contribution-spectrum.mjs"
      - ".github/workflows/contribution-spectrum.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate green/public and blue/private commit calendar
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-contribution-spectrum.mjs

      - name: Commit refreshed graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-spectrum.svg
          git diff --staged --quiet || git commit -m "chore: refresh contribution spectrum"
          git push
